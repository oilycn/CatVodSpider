name: 自动编译并发布专属 Jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: 赋予执行权限并编译
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 提取并重命名 Jar
        run: |
          mkdir -p output
          # 提取打包出来的 classes.dex / spider.jar
          find app/build/outputs -name "*.jar" -exec cp {} output/spider.jar \;

      - name: 上传产物到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: output/spider.jar
